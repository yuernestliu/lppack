[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lppack"
version = "3.0.0"
description = "Ladderpath toolkit for nested hierarchical structure in sequences"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ecsLab" },
]
keywords = [
  "ladderpath",
  "hierarchy",
  "sequence-analysis",
  "compression",
  "phylogeny",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "biopython>=1.81",
  "graphviz>=0.20",
  "jieba>=0.42",
  "matplotlib>=3.7",
  "numba>=0.58",
  "numpy>=1.24",
  "pydivsufsort>=0.0.14",
  "scipy>=1.10",
  "tqdm>=4.64",
  "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/yuernestliu/lppack"
Documentation = "https://github.com/yuernestliu/lppack#documentation"
Repository = "https://github.com/yuernestliu/lppack"
Issues = "https://github.com/yuernestliu/lppack/issues"

[tool.setuptools]
packages = ["lppack", "lppack.ladderpath_tools"]
include-package-data = false

[tool.setuptools.package-dir]
lppack = "."
